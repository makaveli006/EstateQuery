[project]
name = "estatequery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.10.0",
    "asyncpg>=0.32.0",
    "chainlit>=2.12.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "openai>=3.55.1",
    "pydantic-settings>=2.16.3",
    "selectolax>=1.0.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
estatequery = "estatequery:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
scrape = [
    "playwright>=1.65.2",
]
