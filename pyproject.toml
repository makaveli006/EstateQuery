[project]
name = "estatequery"
version = "0.1.0"
description = "Agentic real estate assistant grounded in DarGlobal and Wasalt data"
readme = "README.md"
authors = [
    { name = "Subin", email = "subinkrishna006@gmail.com" }
]
requires-python = ">=3.13.3"
dependencies = [
    "anthropic>=2.10.0",
    "chainlit>=2.12.0",
    "fastapi>=0.163.2",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "openai>=3.55.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
ingest = [
    "playwright>=1.65.2",
    "selectolax>=1.0.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # modern Python syntax
    "B",       # likely bugs
    "SIM",     # simplifications
    "C4",      # comprehensions
    "S",       # security checks
    "RUF",     # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest works
    "S105",  # tests use obviously fake credentials
    "S106",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
